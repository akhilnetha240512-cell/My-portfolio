
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Portfolio | Private Vault</title>
<style>
:root{color-scheme:dark;--bg:#080d1b;--panel:#121b30;--line:#293650;--text:#edf3ff;--muted:#9eacc6;--accent:#8b9dff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
main{width:min(760px,92%);margin:45px auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:clamp(25px,6vw,38px);margin:8px 0}
p{color:var(--muted);line-height:1.6}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:20px}
button,input{font:inherit;border-radius:10px;padding:12px;width:100%;margin-top:10px}
button{background:var(--accent);color:#0a1023;border:0;font-weight:700;cursor:pointer}
button.secondary{background:#202c46;color:var(--text);border:1px solid var(--line)}
input{background:#080f20;color:white;border:1px solid var(--line)}
a{color:#b6c4ff;overflow-wrap:anywhere}
.hidden{display:none!important}
.status{color:#c5d1ff;overflow-wrap:anywhere}
.item{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .info{flex:1;min-width:0;overflow-wrap:anywhere}
.item small{display:block;color:var(--muted);margin-top:4px}
.item button{width:auto;min-width:76px;margin:0}
#message{white-space:pre-wrap}
footer{margin:30px 0;color:var(--muted);font-size:12px}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <p>MY PERSONAL SPACE</p>
      <h1>Akhil's Portfolio</h1>
    </div>
    <span style="font-size:36px">🌌</span>
  </header>

  <section id="home" class="panel">
    <h2>About Me</h2>
    <p>Welcome to my personal portfolio.</p>
    <button id="rocket" type="button">🚀 Open Private Vault</button>
  </section>

  <section id="login" class="panel hidden">
    <h2>🔐 Sign in</h2>
    <p>Sign in with your authorised account to continue.</p>
    <button id="googleLogin" type="button">Continue with Google</button>
    <hr style="border-color:var(--line);margin:22px 0">
    <form id="emailForm">
      <label for="email">Email address</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Sign in with email</button>
    </form>
    <button class="secondary" id="backHome" type="button">Back to portfolio</button>
  </section>

  <section id="codePanel" class="panel hidden">
    <h2>🔑 Secret Code</h2>
    <p>Enter your separate vault code.</p>
    <form id="codeForm">
      <input id="secretCode" type="password" autocomplete="off"
        placeholder="Enter secret code" required>
      <button type="submit">Unlock files</button>
    </form>
    <button class="secondary" id="cancelCode" type="button">Cancel</button>
  </section>

  <section id="filesPanel" class="panel hidden">
    <h2>📁 Your Google Drive</h2>
    <p id="accountLabel"></p>
    <p id="folderLabel">Your files and folders</p>
    <button class="secondary hidden" id="parentFolder" type="button">← Parent folder</button>
    <button class="secondary" id="refresh" type="button">Refresh files</button>
    <div id="fileList"></div>
    <p id="message" class="status" role="status"></p>
    <button class="secondary" id="logout" type="button">Sign out</button>
  </section>

  <footer>Private Vault · No file deletion feature</footer>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://accounts.google.com/gsi/client" async></script>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6DaGR6ZNyK4oiMNohWU4sIUQBqxtwtlg",
  authDomain: "akhil-private-vault.firebaseapp.com",
  projectId: "akhil-private-vault",
  storageBucket: "akhil-private-vault.firebasestorage.app",
  messagingSenderId: "800739585946",
  appId: "1:800739585946:web:63d019b52c35aa25d89423",
  measurementId: "G-7338KL9XM8"
};

const GOOGLE_OAUTH_CLIENT_ID =
  "800739585946-jv5nfribhafi1c49qnajanl2adc4fjna.apps.googleusercontent.com";

const DRIVE_FOLDER_ID = "1PNZspXcpMfj_2pD9tjUqlkfHYbsmm0mB";
const ALLOWED_EMAIL = "akhilnetha240512@gmail.com";

/*
  DEMO ONLY:
  A code embedded in HTML is visible to anyone who inspects the source.
  This is not secure server-side secret-code verification.
*/
const SECRET_CODE = "240512";

const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
const FOLDER_MIME = "application/vnd.google-apps.folder";

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentUser = null;
let accessToken = null;
let tokenClient = null;
let folderStack = [{id: DRIVE_FOLDER_ID, name: "My Drive folder"}];

const $ = id => document.getElementById(id);

function showOnly(id) {
  ["home", "login", "codePanel", "filesPanel"].forEach(name =>
    $(name).classList.toggle("hidden", name !== id)
  );
}

function message(text) {
  $("message").textContent = text;
}

function allowed(user) {
  return !!user && (user.email || "").toLowerCase() === ALLOWED_EMAIL;
}

function initDriveClient() {
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    throw new Error("Google sign-in service is still loading. Try again.");
  }

  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_OAUTH_CLIENT_ID,
    scope: DRIVE_SCOPE,
    callback: async response => {
      if (response.error) {
        message("Drive access was not granted: " + response.error);
        return;
      }
      accessToken = response.access_token;
      folderStack = [{id: DRIVE_FOLDER_ID, name: "My Drive folder"}];
      await loadFolder(DRIVE_FOLDER_ID);
    },
    error_callback: error => {
      message("Google authorisation did not open. Try again.");
    }
  });
}

async function signInWithGoogle() {
  try {
    const result = await auth.signInWithPopup(
      new firebase.auth.GoogleAuthProvider()
    );
    if (!allowed(result.user)) {
      await auth.signOut();
      showOnly("home");
      alert("You are not Akhil");
      return;
    }
    currentUser = result.user;
    showOnly("codePanel");
  } catch (error) {
    alert(error.message || "Google sign-in failed.");
  }
}

async function signInWithEmail(event) {
  event.preventDefault();
  try {
    const result = await auth.signInWithEmailAndPassword(
      $("email").value.trim(),
      $("password").value
    );
    if (!allowed(result.user)) {
      await auth.signOut();
      showOnly("home");
      alert("You are not Akhil");
      return;
    }
    currentUser = result.user;
    showOnly("codePanel");
  } catch (error) {
    alert(error.message || "Email sign-in failed.");
  }
}

async function rejectCode() {
  alert("You are not Akhil");
  currentUser = null;
  accessToken = null;
  $("secretCode").value = "";
  await auth.signOut();
  showOnly("home");
}

async function unlock(event) {
  event.preventDefault();

  if (!allowed(currentUser)) {
    await rejectCode();
    return;
  }

  if ($("secretCode").value !== SECRET_CODE) {
    await rejectCode();
    return;
  }

  $("secretCode").value = "";
  showOnly("filesPanel");
  $("accountLabel").textContent = "Signed in as " + currentUser.email;
  message("Requesting permission to view your Google Drive…");

  try {
    initDriveClient();
    tokenClient.requestAccessToken({prompt: "consent"});
  } catch (error) {
    message(error.message || "Could not start Google Drive access.");
  }
}

async function driveRequest(url) {
  const response = await fetch(url, {
    headers: {Authorization: "Bearer " + accessToken}
  });
  if (!response.ok) {
    const detail = await response.text();
    throw new Error("Drive request failed (" + response.status + "). " +
      detail.slice(0, 250));
  }
  return response.json();
}

async function loadFolder(folderId) {
  $("fileList").replaceChildren();
  message("Loading files…");

  try {
    const query = encodeURIComponent(
      "'" + folderId + "' in parents and trashed = false"
    );
    const fields = encodeURIComponent(
      "files(id,name,mimeType,webViewLink,size,modifiedTime),nextPageToken"
    );

    let pageToken = "";
    let allFiles = [];

    do {
      const page = pageToken
        ? "&pageToken=" + encodeURIComponent(pageToken)
        : "";

      const url = "https://www.googleapis.com/drive/v3/files" +
        "?q=" + query +
        "&fields=" + fields +
        "&pageSize=100" +
        "&orderBy=folder,name" + page;

      const data = await driveRequest(url);
      allFiles = allFiles.concat(data.files || []);
      pageToken = data.nextPageToken || "";
    } while (pageToken);

    allFiles.sort((a, b) => {
      const af = a.mimeType === FOLDER_MIME ? 0 : 1;
      const bf = b.mimeType === FOLDER_MIME ? 0 : 1;
      return af - bf || a.name.localeCompare(b.name);
    });

    $("folderLabel").textContent =
      "Folder: " + folderStack[folderStack.length - 1].name;
    $("parentFolder").classList.toggle("hidden", folderStack.length <= 1);

    if (!allFiles.length) {
      message("This folder is empty, or Drive returned no visible files.");
      return;
    }

    message("");

    for (const file of allFiles) {
      const isFolder = file.mimeType === FOLDER_MIME;
      const row = document.createElement("div");
      row.className = "item";

      const icon = document.createElement("span");
      icon.textContent = isFolder ? "📁" : "📄";
      icon.style.fontSize = "25px";

      const info = document.createElement("div");
      info.className = "info";

      const title = document.createElement("strong");
      title.textContent = file.name;
      info.appendChild(title);

      const meta = document.createElement("small");
      meta.textContent = isFolder ? "Folder" : "File · opens in Google Drive";
      info.appendChild(meta);

      const button = document.createElement("button");
      button.textContent = isFolder ? "Open" : "View";

      button.addEventListener("click", async () => {
        if (isFolder) {
          folderStack.push({id: file.id, name: file.name});
          await loadFolder(file.id);
        } else {
          const url = file.webViewLink ||
            "https://drive.google.com/open?id=" +
            encodeURIComponent(file.id);
          window.open(url, "_blank", "noopener,noreferrer");
        }
      });

      row.append(icon, info, button);
      $("fileList").appendChild(row);
    }
  } catch (error) {
    message(error.message +
      "\nCheck Drive API access, OAuth consent, and folder permissions.");
  }
}

$("rocket").addEventListener("click", () => {
  $("message").textContent = "";
  showOnly("login");
});
$("googleLogin").addEventListener("click", signInWithGoogle);
$("emailForm").addEventListener("submit", signInWithEmail);
$("codeForm").addEventListener("submit", unlock);

$("backHome").addEventListener("click", async () => {
  if (auth.currentUser) await auth.signOut();
  currentUser = null;
  showOnly("home");
});
$("cancelCode").addEventListener("click", async () => {
  if (auth.currentUser) await auth.signOut();
  currentUser = null;
  showOnly("home");
});
$("refresh").addEventListener("click", () => {
  if (accessToken) {
    loadFolder(folderStack[folderStack.length - 1].id);
  } else {
    message("Please sign in and unlock the vault again.");
  }
});
$("parentFolder").addEventListener("click", () => {
  if (folderStack.length > 1) {
    folderStack.pop();
    loadFolder(folderStack[folderStack.length - 1].id);
  }
});
$("logout").addEventListener("click", async () => {
  accessToken = null;
  currentUser = null;
  folderStack = [{id: DRIVE_FOLDER_ID, name: "My Drive folder"}];
  await auth.signOut();
  showOnly("home");
});

auth.onAuthStateChanged(user => {
  if (user && allowed(user)) {
    currentUser = user;
  } else {
    currentUser = null;
  }
});
</script>
</body>
</html>
